[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topoperturb"
version = "0.1.0"
description = "Persistent homology of single-cell CRISPR perturbations (CausalBench)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "ripser==0.6.15",
    "persim==0.4.1",
    "matplotlib==3.9.4",
    "huggingface_hub",
]

[project.optional-dependencies]
# Only needed to run experiments/verify_methods.py (independent cross-checks).
verify = ["networkx"]

[tool.setuptools]
packages = ["topoperturb"]
